<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker | Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Global Loader -->
    <div id="loader" class="overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Sincronizando dados...</p>
        </div>
    </div>

    <!-- Error Notification -->
    <div id="error-banner" class="error-banner hidden">
        <span id="error-message"></span>
        <button onclick="closeError()">×</button>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="overlay">
        <div class="auth-card">
            <div class="auth-header">
                <h1 id="auth-title">Entrar</h1>
                <p id="auth-subtitle">Gestão financeira minimalista</p>
            </div>

            <form id="auth-form">
                <div class="input-group hidden" id="name-group">
                    <label>Nome Completo</label>
                    <input type="text" id="auth-name" placeholder="Seu nome">
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="auth-email" placeholder="email@exemplo.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="auth-submit-btn">Entrar</button>
            </form>

            <div class="auth-footer">
                <button id="toggle-auth">Não tem conta? Crie uma agora</button>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="container hidden">
        <header>
            <h1>ExpenseTracker</h1>
            <div class="header-actions">
                <span class="user-status" id="user-status">...</span>
                <button id="logout-btn" class="logout-btn">Sair</button>
            </div>
        </header>

        <main class="grid">
            <!-- Budget Summary Card -->
            <section class="card budget-card">
                <h2>Saldo Disponível</h2>
                <div class="budget-value">
                    <span id="balance">0,00</span>
                    <span class="currency">MYR</span>
                </div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <p class="budget-detail">
                    <span>Limite Mensal: <strong id="budget-limit">0,00</strong></span>
                    <span id="budget-percent">0%</span>
                </p>
            </section>

            <!-- Expense Form Card -->
            <section class="card form-card">
                <h2>Nova Despesa</h2>
                <form id="expense-form">
                    <div class="input-group">
                        <label for="amount">Valor</label>
                        <input type="number" id="amount" step="0.01" placeholder="0,00" required>
                    </div>
                    <div class="input-group">
                        <label for="description">Descrição</label>
                        <input type="text" id="description" placeholder="Ex: Café da manhã" required>
                    </div>
                    <div class="input-group">
                        <label for="category">Categoria</label>
                        <select id="category">
                            <option value="Alimentação">Alimentação</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn">Adicionar Gasto</button>
                </form>
            </section>
        </main>

        <section class="history-section">
            <div class="history-header">
                <h2>Histórico Recente</h2>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-tx" class="search-input" placeholder="Pesquisar transações...">
                </div>
            </div>
            <div id="transactions-list" class="transactions-grid"></div>
            <div id="empty-state" class="empty-state hidden">
                Nenhuma transação encontrada.
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
