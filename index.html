<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker | Minimalist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Global Loader -->
    <div id="loader" class="overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Sincronizando dados...</p>
        </div>
    </div>

    <!-- Error Notification -->
    <div id="error-banner" class="error-banner hidden">
        <span id="error-message"></span>
        <button onclick="closeError()">×</button>
    </div>

    <div class="container">
        <header>
            <h1>ExpenseTracker</h1>
            <div class="user-status" id="user-status">Carregando perfil...</div>
        </header>

        <main class="grid">
            <!-- Budget Summary Card -->
            <section class="card budget-card">
                <h2>Saldo Disponível</h2>
                <div class="budget-value">
                    <span id="balance">0,00</span>
                    <span class="currency">MYR</span>
                </div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <p class="budget-detail">Limite Mensal: <span id="budget-limit">0,00</span></p>
            </section>

            <!-- Expense Form Card -->
            <section class="card form-card">
                <h2>Nova Despesa</h2>
                <form id="expense-form">
                    <div class="input-group">
                        <label for="amount">Valor</label>
                        <input type="number" id="amount" step="0.01" placeholder="0,00" required>
                    </div>
                    <div class="input-group">
                        <label for="description">Descrição</label>
                        <input type="text" id="description" placeholder="Ex: Café da manhã" required>
                    </div>
                    <div class="input-group">
                        <label for="category">Categoria</label>
                        <select id="category">
                            <option value="Alimentação">Alimentação</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn">Adicionar Gasto</button>
                </form>
            </section>
        </main>

        <section class="history-section">
            <h2>Histórico Recente</h2>
            <div id="transactions-list" class="transactions-grid">
                <!-- Transactions injected here -->
            </div>
            <div id="empty-state" class="empty-state hidden">
                Nenhuma transação encontrada.
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
