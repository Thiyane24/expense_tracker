<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpenseTracker | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1c1917; overflow-x: hidden; }
        .input-field { border-bottom: 1px solid #e7e5e4; transition: all 0.3s ease; }
        .input-field:focus { border-bottom-color: #1c1917; outline: none; }
        .btn-primary { background-color: #1c1917; color: #ffffff; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: #3f3d3c; letter-spacing: 0.1em; }
        .btn-primary:active { transform: scale(0.98); }
        .loader-ring { border: 2px solid #f3f4f6; border-top: 2px solid #1c1917; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #ffffff; }
        ::-webkit-scrollbar-thumb { background: #e7e5e4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d6d3d1; }
    </style>
</head>
<body class="min-h-screen">

    <div id="global-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
        <div class="loader-ring mb-4"></div>
        <p class="text-[10px] font-bold text-stone-400 uppercase tracking-[0.2em]">Iniciando Sistema</p>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-white transition-all duration-500">
        <div class="w-full max-w-sm">
            <div id="auth-header" class="mb-16 text-center">
                <h1 id="auth-title" class="text-5xl font-extralight tracking-tighter text-stone-900 mb-2">Entrar</h1>
                <p id="auth-subtitle" class="text-stone-400 text-sm font-light">Gestão financeira minimalista</p>
            </div>
            <form id="auth-form" class="space-y-10">
                <div id="signup-fields" class="hidden">
                    <input type="text" id="auth-name" placeholder="Nome Completo" class="w-full py-3 px-0 bg-transparent border-b border-stone-200 input-field placeholder:text-stone-300 text-lg font-light" required>
                </div>
                <div class="relative group">
                    <input type="email" id="auth-email" placeholder="E-mail" class="w-full py-3 px-0 bg-transparent border-b border-stone-200 input-field placeholder:text-stone-300 text-lg font-light" required>
                </div>
                <div class="relative group">
                    <input type="password" id="auth-password" placeholder="Senha" class="w-full py-3 px-0 bg-transparent border-b border-stone-200 input-field placeholder:text-stone-300 text-lg font-light" required>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-4 btn-primary rounded-none font-medium text-sm uppercase tracking-widest">Entrar</button>
            </form>
            <div class="mt-12 text-center">
                <button id="toggle-auth" class="text-[10px] text-stone-400 hover:text-stone-900 transition-all uppercase tracking-[0.2em] font-semibold">Não tem conta? Crie uma agora</button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden transition-all duration-500">
        <nav class="fixed top-0 left-0 right-0 z-40 px-8 py-6 flex justify-between items-center bg-white/80 backdrop-blur-md border-b border-stone-100">
            <span class="font-semibold text-stone-900 tracking-tighter text-2xl">ExpenseTracker</span>
            <div class="flex items-center gap-8">
                <select id="currency-selector" class="bg-transparent text-xs font-medium text-stone-900 outline-none cursor-pointer hover:text-stone-600 transition-colors uppercase tracking-widest">
                    <option value="MYR">MYR</option>
                    <option value="MZN">MZN</option>
                </select>
                <button id="logout-btn" class="text-stone-400 hover:text-stone-900 transition-all text-xs font-bold uppercase tracking-widest">Sair</button>
            </div>
        </nav>
        <main class="pt-28 pb-20 px-8 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-20">
            <div class="lg:col-span-4 space-y-16">
                <section class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-[10px] font-bold text-stone-400 uppercase tracking-[0.2em]">Saldo Disponível</h2>
                        <button id="edit-budget-btn" class="text-[10px] text-stone-400 hover:text-stone-900 transition-colors uppercase tracking-widest underline decoration-stone-200 underline-offset-4">Editar Limite</button>
                    </div>
                    <div class="flex items-baseline gap-3">
                        <span id="budget-total" class="text-7xl font-extralight tracking-tighter text-stone-900">0,00</span>
                        <span class="currency-label text-stone-400 font-medium text-lg uppercase">MYR</span>
                    </div>
                    <div class="h-[1px] w-full bg-stone-100 overflow-hidden mt-8">
                        <div id="budget-bar" class="h-full transition-all duration-1000 bg-stone-900" style="width: 0%"></div>
                    </div>
                </section>
                <section class="space-y-8 bg-stone-50/50 p-8 rounded-2xl border border-stone-100">
                    <h2 class="text-[10px] font-bold text-stone-400 uppercase tracking-[0.2em]">Novo Gasto</h2>
                    <form id="expense-form" class="space-y-8">
                        <div class="relative">
                            <label class="text-[10px] text-stone-400 uppercase tracking-widest block mb-1">Valor</label>
                            <input type="number" id="amount" step="0.01" placeholder="0,00" class="w-full text-3xl font-light py-2 px-0 bg-transparent border-b border-stone-200 input-field placeholder:text-stone-200" required>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] text-stone-400 uppercase tracking-widest block mb-1">Descrição</label>
                            <input type="text" id="description" placeholder="No que você gastou?" class="w-full py-2 px-0 bg-transparent border-b border-stone-200 input-field placeholder:text-stone-200 text-lg font-light" required>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] text-stone-400 uppercase tracking-widest block mb-1">Categoria</label>
                            <select id="category" class="w-full py-2 px-0 bg-transparent border-b border-stone-200 input-field text-stone-500 text-sm outline-none cursor-pointer font-light">
                                <option value="Alimentação">Alimentação</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Saúde">Saúde</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full py-5 btn-primary rounded-none font-medium text-xs uppercase tracking-[0.2em]">
                            <span id="btn-text">Adicionar Gasto</span>
                        </button>
                        <div id="error-msg" class="hidden text-center text-red-500 text-xs font-medium tracking-tight">Preencha todos os campos corretamente.</div>
                    </form>
                </section>
            </div>
            <div class="lg:col-span-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 mb-12">
                    <div class="flex items-center gap-8 w-full sm:w-auto">
                        <h2 class="text-3xl font-extralight text-stone-900 tracking-tight">Histórico</h2>
                        <div class="relative flex-1 sm:w-80">
                            <input type="text" id="search-tx" placeholder="Pesquisar transações..." class="w-full text-xs py-3 px-4 bg-stone-50 border border-stone-100 rounded-full outline-none focus:border-stone-300 transition-all placeholder:text-stone-300 font-light">
                        </div>
                    </div>
                    <span class="text-[10px] font-bold text-stone-400 uppercase tracking-widest" id="tx-count">0 transações</span>
                </div>
                <div id="transactions-list" class="space-y-2"></div>
                <div id="empty-state" class="hidden py-32 text-center">
                    <p class="text-stone-300 font-light text-lg">Nenhum gasto registrado neste período.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="budget-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-white/90 backdrop-blur-md">
        <div class="w-full max-w-md p-12 bg-white border border-stone-200 rounded-3xl shadow-2xl">
            <h3 class="text-2xl font-extralight text-stone-900 mb-10 tracking-tight text-center">Definir Orçamento Mensal</h3>
            <div class="flex flex-col gap-10">
                <input type="number" id="new-budget-amount" placeholder="0,00" class="w-full py-3 px-0 bg-transparent border-b border-stone-200 input-field text-4xl font-light text-center outline-none">
                <div class="flex gap-4">
                    <button id="save-budget-btn" class="flex-1 py-4 btn-primary rounded-none text-xs font-bold uppercase tracking-widest">Guardar</button>
                    <button id="close-budget-btn" class="px-8 py-4 text-stone-400 hover:text-stone-900 text-xs font-bold uppercase tracking-widest transition-colors">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://expensetracker1-e54cc47539ed.herokuapp.com/api';
        const state = { user: null, token: localStorage.getItem('token') || null, currency: 'MYR', budgetLimit: 5000, spentAmount: 0, transactions: [] };
        const screens = { auth: document.getElementById('auth-screen'), app: document.getElementById('app-screen') };
        const forms = { auth: document.getElementById('auth-form'), expense: document.getElementById('expense-form') };
        const ui = {
            budgetTotal: document.getElementById('budget-total'),
            budgetBar: document.getElementById('budget-bar'),
            transactionsList: document.getElementById('transactions-list'),
            emptyState: document.getElementById('empty-state'),
            submitBtn: document.getElementById('submit-btn'),
            btnText: document.getElementById('btn-text'),
            errorMsg: document.getElementById('error-msg'),
            currencyLabels: document.querySelectorAll('.currency-label'),
            txCount: document.getElementById('tx-count'),
            authTitle: document.getElementById('auth-title'),
            authSubtitle: document.getElementById('auth-subtitle'),
            authSubmitBtn: document.getElementById('auth-submit-btn'),
            signupFields: document.getElementById('signup-fields'),
            globalLoader: document.getElementById('global-loader')
        };
        let isLoginMode = true;
        async function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            ui.authTitle.innerText = isLoginMode ? 'Entrar' : 'Criar Conta';
            ui.authSubtitle.innerText = isLoginMode ? 'Gestão financeira minimalista' : 'Comece a gerir as suas despesas';
            ui.authSubmitBtn.innerText = isLoginMode ? 'Entrar' : 'Registar';
            ui.signupFields.classList.toggle('hidden');
            document.getElementById('toggle-auth').innerText = isLoginMode ? 'Não tem conta? Crie uma agora' : 'Já tem conta? Faça login';
        }
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const endpoint = isLoginMode ? '/auth/login' : '/auth/signup';
            try {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erro na autenticação');
                if (isLoginMode) {
                    localStorage.setItem('token', data.token);
                    state.token = data.token;
                    state.user = { id: data.id, email: data.email, budget: data.budget };
                    state.budgetLimit = data.budget || 5000;
                } else {
                    alert('Conta criada com sucesso! Por favor, faça login.');
                    toggleAuthMode();
                }
                if (isLoginMode) showApp();
            } catch (err) { alert(err.message); }
        }
        function handleLogout() {
            localStorage.removeItem('token');
            state.token = null;
            state.user = null;
            showLogin();
        }
        function showApp() {
            screens.auth.classList.add('hidden');
            screens.app.classList.remove('hidden');
            initApp();
        }
        function showLogin() {
            screens.app.classList.add('hidden');
            screens.auth.classList.remove('hidden');
        }
        async function initApp() {
            try {
                updateBudgetUI();
                await fetchTransactions();
            } catch (err) {
                console.error('Erro na inicialização do app:', err);
            } finally {
                ui.globalLoader.classList.add('opacity-0');
                setTimeout(() => ui.globalLoader.classList.add('hidden'), 500);
            }
        }
        async function fetchTransactions() {
            try {
                const res = await fetch(`${API_BASE_URL}/transactions`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (!res.ok) throw new Error('Erro ao carregar transações');
                state.transactions = await res.json();
            } catch (err) {
                console.error('Erro:', err);
                state.transactions = [];
            }
            calculateTotals();
            renderTransactions();
        }
        function calculateTotals() {
            state.spentAmount = state.transactions.reduce((acc, t) => acc + t.amount, 0);
            updateBudgetUI();
        }
        function updateBudgetUI() {
            const budget = state.budgetLimit && state.budgetLimit > 0 ? state.budgetLimit : 0;
            const percent = budget > 0 ? (state.spentAmount / budget) * 100 : 0;
            const available = budget - state.spentAmount;
            ui.budgetTotal.innerText = available.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            ui.budgetBar.style.width = `${Math.min(percent, 100)}%`;
            ui.currencyLabels.forEach(el => el.innerText = state.currency);
        }
        function renderTransactions(filter = '') {
            const filtered = state.transactions.filter(t => t.description.toLowerCase().includes(filter.toLowerCase()));
            ui.txCount.innerText = `${filtered.length} transações`;
            if (filtered.length === 0) {
                ui.emptyState.classList.remove('hidden');
                ui.transactionsList.innerHTML = '';
                return;
            }
            ui.emptyState.classList.add('hidden');
            ui.transactionsList.innerHTML = filtered.map(t => `
                <div class="py-6 px-4 flex justify-between items-center group hover:bg-stone-50 transition-all rounded-xl border-b border-transparent hover:border-stone-100">
                    <div class="flex flex-col">
                        <span class="text-base font-medium text-stone-800">${t.description}</span>
                        <span class="text-[10px] text-stone-400 uppercase tracking-widest mt-1">${t.date} • ${t.category}</span>
                    </div>
                    <div class="flex items-center gap-8">
                        <span class="text-base font-medium text-stone-900">- ${t.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} ${state.currency}</span>
                        <button onclick="deleteTransaction(${t.id})" class="text-[10px] text-stone-300 hover:text-red-500 transition-all uppercase tracking-widest font-semibold">Remover</button>
                    </div>
                </div>
            `).join('');
        }
        async function handleExpenseSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            ui.errorMsg.classList.add('hidden');
            ui.submitBtn.disabled = true;
            ui.btnText.innerText = 'A processar...';
            try {
                const res = await fetch(`${API_BASE_URL}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
                    body: JSON.stringify({ amount, description, category })
                });
                if (!res.ok) throw new Error('Erro ao salvar transação');
                const newTx = await res.json();
                state.transactions.unshift(newTx);
                calculateTotals();
                renderTransactions();
                ui.btnText.innerText = 'Sucesso!';
                ui.submitBtn.classList.replace('bg-stone-900', 'bg-green-600');
                setTimeout(() => {
                    ui.btnText.innerText = 'Adicionar Gasto';
                    ui.submitBtn.classList.replace('bg-green-600', 'bg-stone-900');
                    ui.submitBtn.disabled = false;
                    forms.expense.reset();
                }, 1500);
            } catch (err) {
                console.error('Erro:', err);
                ui.errorMsg.innerText = 'Erro ao adicionar gasto. Tente novamente.';
                ui.errorMsg.classList.remove('hidden');
                ui.btnText.innerText = 'Erro!';
                ui.submitBtn.disabled = false;
            }
        }
        window.deleteTransaction = async (id) => {
            try {
                await fetch(`${API_BASE_URL}/transactions/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                state.transactions = state.transactions.filter(t => t.id !== id);
                calculateTotals();
                renderTransactions();
            } catch (err) { alert('Erro ao remover transação'); }
        };
        document.getElementById('edit-budget-btn').onclick = () => { document.getElementById('budget-modal').classList.remove('hidden'); };
        document.getElementById('close-budget-btn').onclick = () => { document.getElementById('budget-modal').classList.add('hidden'); };
        document.getElementById('save-budget-btn').onclick = async () => {
            const amount = document.getElementById('new-budget-amount').value;
            if (!amount) return;
            try {
                const res = await fetch(`${API_BASE_URL}/auth/budget`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
                    body: JSON.stringify({ amount: amount })
                });
                const data = await res.json();
                state.budgetLimit = parseFloat(data.newBudget);
                updateBudgetUI();
                document.getElementById('budget-modal').classList.add('hidden');
            } catch (err) { alert('Erro ao atualizar orçamento'); }
        };
        document.getElementById('toggle-auth').onclick = toggleAuthMode;
        forms.auth.onsubmit = handleAuth;
        forms.expense.onsubmit = handleExpenseSubmit;
        document.getElementById('logout-btn').onclick = handleLogout;
        document.getElementById('currency-selector').onchange = (e) => {
            state.currency = e.target.value;
            updateBudgetUI();
            renderTransactions();
        };
        document.getElementById('search-tx').oninput = (e) => { renderTransactions(e.target.value); };
        if (state.token) showApp(); else showLogin();
    </script>
</body>
</html>
